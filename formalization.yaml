version: v0.2
project:
  name: math-proofs
  description: Lean formalizations with explicit statement scope and remaining application boundaries.
  authors:
  - Derek Blair
  license: not specified
  lean_version: 4.34.1
  mathlib_version: v4.34.1
status_definitions:
  '[PROVED]': The named Lean statement is kernel-checked using only standard axioms; this does not assert a broader
    application.
  '[CONDITIONAL]': The classification or application retains explicit mathematical inputs as theorem arguments;
    the conditional statement is kernel-checked.
  '[PROVED*]': Staged publication status for named kernel-checked statements; not an assertion of an unassembled
    larger claim.
  '[COMPUTED]': External computation without Lean kernel certification.
  supporting definitions: Definitions or infrastructure with no listed flagship theorem.
axioms_convention: The axioms field lists only axioms beyond propext, Classical.choice, and Quot.sound; [] means
  no additional axioms.
artifact_policy:
  correction_date: '2026-10-23'
  authoritative_overview: overview.tex
  historical_pdf_paths:
  - overview.pdf
  - papers/erdos-straus-identity-217mod264-October-3-2026/erdos-straus-identity-217mod264-October-3-2026.pdf
  - papers/erdos-straus-finite-identity-barrier-October-4-2026/erdos-straus-finite-identity-barrier-October-4-2026.pdf
  - papers/sieve-inverse-branch-isolation-October-11-2026/sieve-inverse-branch-isolation-October-11-2026.pdf
  - papers/r47-sat184-October-7-2026/r47-sat184-October-7-2026.pdf
  pdf_status: historical_pre_correction
  note: Affected PDFs were not regenerated because no TeX toolchain is installed in this lane. Corrected TeX sources
    and current catalogues are authoritative.
