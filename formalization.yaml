- title: An Erdős–Straus covering identity
  authors:
  - Derek Blair
  id: papers/erdos-straus-identity-217mod264-October-3-2026/erdos-straus-identity-217mod264-October-3-2026.pdf
  type: article
  lean_module: Mathproofs/ESIdentity.lean
  theorems:
  - es_covering_217mod264
  - es_identity_217mod264
  status: '[PROVED]'
  axioms: []
  scope: positive_natural_covering_witnesses
  note: For every natural n congruent to 217 modulo 264, es_covering_217mod264 supplies positive natural x,y,z with
    4x=n+3, y=n(n+3), 11z=n(n+3), and 4/n=1/x+1/y+1/z. The original theorem is the rational-equality lemma.
  current_source: papers/erdos-straus-identity-217mod264-October-3-2026/erdos-straus-identity-217mod264-October-3-2026.tex
  pdf_status: historical_pre_correction
- title: CRT Escape from Local Quadratic Obstructions on Square Classes Modulo 840
  authors:
  - Derek Blair
  id: papers/erdos-straus-finite-identity-barrier-October-4-2026/erdos-straus-finite-identity-barrier-October-4-2026.pdf
  type: article
  lean_module: Mathproofs/ESBarrier.lean
  theorems:
  - es_crt_escape
  status: '[PROVED]'
  axioms: []
  scope: conditional_crt_escape_kernel
  unformalized:
  - Schinzel-Mordell implication from integer polynomial identities to the supplied local obstructions
  note: Infinitely many escaping primes in each listed square class modulo 840, assuming 8 divides every progression
    modulus and a supplied odd-prime nonsquare obstruction or failure of the 1-mod-8 residue condition. Uses Mathlib
    general Dirichlet. The inconsistent custom axioms and false rational-polynomial es_barrier statement were removed.
  current_source: papers/erdos-straus-finite-identity-barrier-October-4-2026/erdos-straus-finite-identity-barrier-October-4-2026.tex
  pdf_status: historical_pre_correction
