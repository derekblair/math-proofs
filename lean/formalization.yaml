status:
  scope: "All 15 catalogued result families (plus Rule 129 and post-scope Seam B / Seam C modules) have kernel-checked Lean 4 formalizations; explicit per-family boundaries and unformalized bridges are documented in docs/."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  # Entries use source-qualified declaration names and the files containing them.
  # Populated with ComparatorChallenges entries in Step 5.
  main_results: []

automation:
  methods:
    - method: agent
      framework: "Multi-lane research, formalization, and cross-session review orchestrator"

review:
  status: "agent-reviewed"
  notes: "Exported statements are machine-checked by Lean 4.34.1 + leanchecker with standard axioms only and gated on independent cross-session review."

acknowledgements: >-
  Thank you to the authors of Lean 4, Mathlib, Lake, leanchecker, and Comparator.
