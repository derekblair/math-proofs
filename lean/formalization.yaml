# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Catalog of papers with a formalized main result. Paths are relative to lean/.
version: "v0.4"

project:
  name: "math-proofs"
  description: "Lean 4.34.1 + Mathlib v4.34.1 formalizations accompanying a mathematics manuscript collection, with explicit statement scope and remaining application boundaries."
  authors: ["Derek Blair"]
  license: "not specified"
  lean_version: "4.34.1"
  mathlib_version: "v4.34.1"

status_definitions:
  "[PROVED]": "The named Lean statement is kernel-checked using only standard axioms; this does not assert a broader application."
  "[CONDITIONAL]": "The classification or application retains explicit mathematical inputs as theorem arguments; the conditional statement is kernel-checked."
  "[PROVED*]": "Staged publication status for named kernel-checked statements; not an assertion of an unassembled larger claim."
  "[COMPUTED]": "External computation without Lean kernel certification."
  "supporting definitions": "Definitions or infrastructure with no listed flagship theorem."

axioms_convention: "Standard Lean axioms only (propext, Classical.choice, Quot.sound). No sorrys, native_decide certificate axioms, or custom axioms appear in any exported result."

artifact_policy:
  correction_date: "2026-10-23"
  authoritative_overview: "../overview.tex"
  historical_pdf_paths:
    - "../overview.pdf"
    - "../preprints/erdos-straus-identity-217mod264-October-3-2026/paper.pdf"
    - "../preprints/erdos-straus-finite-identity-barrier-October-4-2026/paper.pdf"
    - "../preprints/sieve-inverse-branch-isolation-October-11-2026/paper.pdf"
    - "../preprints/r47-sat184-October-7-2026/paper.pdf"
    - "../preprints/es-absorption-forcing-October-11-2026/paper.pdf"
  pdf_status: "historical_pre_correction"
  note: "These PDFs were not regenerated in the October 23-24 corrections (nor during the November 25 layout restructure, where LaTeX/XeLaTeX was absent on the build host). Corrected TeX sources (../overview.tex and ../preprints/<slug>/build/main.tex) and per-family docs/ scope files are authoritative."

sources:
